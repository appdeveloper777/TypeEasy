services:
  # --- SERVICIO MYSQL ---
  # mysql:
  #  image: mysql:8.0
  # container_name: typeeasy_mysql
  #environment:
  # MYSQL_ROOT_PASSWORD: rootpassword
  #MYSQL_DATABASE: test_db
  #ports:
  # - "3307:3306"
  #volumes:
  # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # --- SERVICIO DE LA API WEB (Sin cambios) ---
  api:
    #depends_on:
    # - mysql
    build:
      context: .
      dockerfile: src/Dockerfile
      target: api
    image: typeeasy-api
    ports:
      - "8080:8080"
    extra_hosts:
      # Asegura que `host.docker.internal` resuelva al gateway IPv4 del host
      # (necesario para conectar a XAMPP MySQL en Windows desde el container).
      - "host.docker.internal:host-gateway"
    environment:
      - TYPEEASY_DEBUG=0
      # --- CSV reader tuning (opcional) ---
      # TE_CSV_MAX_THREADS: tope de hilos para from_csv_to_list (default 16, rango 1-256).
      # Subir en hosts con 32+ cores y CSVs >16MB. Bajar si se comparte el host.
      # - TE_CSV_MAX_THREADS=16
      # TE_CSV_THREADS: fuerza N hilos exactos (sobrescribe heurística y MAX).
      # - TE_CSV_THREADS=8
      # TE_CSV_DATAFRAME=1: activa el modo columnar (más rápido pero rompe iteración OO).
      # - TE_CSV_DATAFRAME=0
      # Configuración de MySQL - Cambia estos valores según tu servidor
      - MYSQL_HOST=mysql # Nombre del servicio MySQL en Docker
      - MYSQL_PORT=3306 # Puerto interno de MySQL
      - MYSQL_USER=root # Usuario de MySQL
      - MYSQL_PASSWORD=rootpassword # Contraseña de MySQL
      - MYSQL_DATABASE=meri # Nombre de la base de datos
      # Secret HS256 para firmar (login) y validar (@auth) los JWT.
      # Se toma de la variable JWT_SECRET del archivo .env (no commiteado).
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./typeeasycode/apis:/app/apis
      - ./typeeasycode/models:/app/models
      - ./typeeasycode/settings:/app/settings

  # --- SERVICIO DEL INTÉRPRETE ---
  typeeasy:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: typeeasy
      args:
        # Nivel de optimización del binario. Por defecto -O3 (producción).
        # Para depurar con gdb (variables sin "optimized out"):
        #   docker compose build --build-arg TE_OPT=-O0 typeeasy
        TE_OPT: ${TE_OPT:--O3}
    # Modo --api por defecto: levanta endpoint.te en :9000.
    # Override: `docker compose run --rm typeeasy <archivo.te>`
    command: ["--api", "endpoint.te", "--port", "9000"]
    ports:
      - "9000:9000"
    extra_hosts:
      # Permite alcanzar XAMPP MySQL (y otros servicios del host Windows)
      # via `host.docker.internal` con IPv4 estable.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./typeeasycode:/code
    environment:
      - TYPEEASY_DEBUG=0
      # Secret HS256 para firmar (login) y validar (@auth) los JWT.
      # Se toma de la variable JWT_SECRET del archivo .env (no commiteado).
      - JWT_SECRET=${JWT_SECRET}
      # --- CSV reader tuning (opcional) ---
      # - TE_CSV_MAX_THREADS=16   # tope de hilos (default 16, rango 1-256)
      # - TE_CSV_THREADS=8        # forzar N hilos exactos
      # - TE_CSV_DATAFRAME=0      # 1 = modo columnar (rompe iteración OO)
      # - TE_CSV_TIMING=0         # 1 = imprimir tiempos de carga
    working_dir: /code
    entrypoint: [ "/typeeasy/typeeasy" ]

  # --- ¡NUEVO! SERVICIO DEL AGENTE (n8n) ---
  agent:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: agent # Apunta a la nueva etapa 6 del Dockerfile
    image: typeeasy-agent
    # Sin `ports:` a propósito: /whatsapp_hook (servidor_agent.c) no tiene
    # NINGUNA autenticación propia -- confía en que solo whatsapp_adapter lo
    # llame internamente (http://agent:8081/whatsapp_hook). Publicarlo al host
    # dejaba que cualquiera que alcance el puerto disparase la conversación
    # completa sin pasar por el chequeo de secreto de /waha_webhook, gastando
    # la cuota de la IA y pudiendo hacer que el bot le responda a un usuario
    # real de WhatsApp (vía el `last_sender` global de whatsapp_adapter).
    environment:
      - TYPEEASY_DEBUG=0
    # El CMD del Dockerfile ya es ["./servidor_agent", "agente_chat_whatsapp.te"]

    depends_on:
      - nlu
      - api_mock

  # --- MOCK NLU service (simple HTTP adapter) ---
  nlu:
    build:
      context: ./tools/nlu_mock
    image: typeeasy-nlu-mock
    ports:
      - "5000:5000"

  # --- MOCK API service (menu provider) ---
  api_mock:
    build:
      context: ./tools/api_mock
    image: typeeasy-api-mock
    ports:
      - "5001:5001"

  # --- ¡NUEVO! SERVICIO GEMINI AI ---
  gemini:
    build:
      context: ./tools/gemini_service
    image: typeeasy-gemini-ai
    # Sin `ports:` a propósito: solo agente_gemini_whatsapp.te lo llama, vía la
    # red interna de compose (http://gemini:5003). Este servicio no tiene
    # ninguna autenticación en /chat, /history ni /clear_history -- publicarlo
    # al host (como estaba: "5003:5003") dejaba a cualquiera que alcance ese
    # puerto (a menudo el caso incluso con firewall en el host, porque las
    # reglas iptables de Docker no pasan por ufw/firewalld por defecto) leer
    # el historial de conversación completo de TODOS los usuarios (PII: número
    # de telefono + mensajes), gastar la cuota paga de la API Key de Gemini
    # configurada, y suplantar a cualquier `from_number` para envenenar su
    # contexto de conversación.
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash-latest}

  # --- ¡NUEVO! AGENTE CON GEMINI (alternativo al agent original) ---
  agent_gemini:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: agent
    image: typeeasy-agent-gemini
    # Sin `ports:` a propósito -- ver el comentario en el servicio `agent`:
    # /whatsapp_hook no tiene autenticación propia y solo debe ser alcanzable
    # desde whatsapp_adapter vía la red interna (http://agent_gemini:8081).
    environment:
      - TYPEEASY_DEBUG=1
    # Usar el nuevo agente con Gemini
    command: [ "./servidor_agent", "agente_gemini_whatsapp.te" ]
    depends_on:
      - api_mock
      - gemini

  whatsapp_adapter:
    build:
      context: ./tools/whatsapp_adapter
    image: typeeasy-whatsapp-adapter
    ports:
      - "5002:5002"
    environment:
      - AGENT_WEBHOOK=http://agent_gemini:8081/whatsapp_hook
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-waha} # waha, meta, or twilio
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_WEBHOOK_SECRET=${WAHA_WEBHOOK_SECRET}
      # Meta WhatsApp Cloud API
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_WHATSAPP_TOKEN=${META_WHATSAPP_TOKEN}
      - META_WHATSAPP_PHONE_ID=${META_WHATSAPP_PHONE_ID}
      # Typing delay (seconds)
      - TYPING_DELAY=${TYPING_DELAY:-2.0}
      # Twilio (optional)
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM=${TWILIO_FROM}
    depends_on:
      - agent

  # --- ¡NUEVO! WAHA (WhatsApp HTTP API) ---
  waha:
    image: devlikeapro/waha
    restart: always
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_RESTART_ON_FAIL=True
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=typeeasy
      # Configurar webhook automáticamente al iniciar. El secreto en la query
      # string autentica el webhook en whatsapp_adapter (ver WAHA_WEBHOOK_SECRET
      # en app.py) ya que WAHA Core no firma sus webhooks con HMAC.
      - WAHA_WEBHOOK_URL=http://whatsapp_adapter:5002/waha_webhook?secret=${WAHA_WEBHOOK_SECRET}
      - WAHA_WEBHOOK_EVENTS=message
    volumes:
      - ./waha_sessions:/app/.sessions
